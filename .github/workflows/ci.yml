name: CI/CD Pipeline Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main App
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Dependency App B
        run: |
          git clone https://github.com/hitcodemann/dummy-app-b.git
          cp dummy-app-b/math_utils.py .

      - name: Clone Dependency App C
        run: |
          git clone https://github.com/hitcodemann/dummy-app-c.git
          cp dummy-app-c/logger.py .

      - name: Run Pipeline (Success Case)
        id: run_success
        run: |
          python main_app.py

      - name: Simulate Failure
        id: run_failure
        run: |
          sed -i 's/run_pipeline(5)/run_pipeline(0)/g' main_app.py
          python main_app.py && exit 0 || exit 1
        continue-on-error: true

      - name: Send Failure to AWS Lambda
        if: steps.run_failure.outcome == 'failure'
        env:
          WEBHOOK_URL: https://ww8cqvvtzg.execute-api.us-east-1.amazonaws.com/prod/webhook
        run: |
          echo "Pipeline FAILED! Sending to AWS..."
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "hitcodemann/dummy-app-a",
              "run_id": "${{ github.run_id }}",
              "job": "build-and-test",
              "error": "ValueError: Invalid steps: Build cannot proceed!",
              "failed_step": "Simulate Failure",
              "timestamp": "${{ github.event.head_commit.timestamp }}",
              "log_hint": "Check calculate_build_time(0) in main_app.py"
            }'
     
