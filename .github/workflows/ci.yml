name: CI/CD Pipeline Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main App
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Dependency App B
        run: |
          git clone https://github.com/hitcodemann/dummy-app-b.git
          cp dummy-app-b/math_utils.py .

      - name: Clone Dependency App C
        run: |
          git clone https://github.com/hitcodemann/dummy-app-c.git
          cp dummy-app-c/logger.py .

      - name: Run Pipeline (Normal)
        id: run_normal
        run: |
          python main_app.py || echo "NORMAL RUN FAILED"

      - name: Force Failure
        id: force_fail
        run: |
          echo "Forcing pipeline failure..."
          sed -i 's/run_pipeline([0-9]*)/run_pipeline(0)/g' main_app.py || true
          python main_app.py && exit 0 || exit 1

      - name: Send Failure to AWS Lambda
        if: always() && steps.force_fail.outcome == 'failure'
        env:
          WEBHOOK_URL: https://ww8cqvvtzg.execute-api.us-east-1.amazonaws.com/prod/webhook
        run: |
          echo "SENDING FAILURE TO AWS LAMBDA..."
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "hitcodemann/dummy-app-a",
              "run_id": "${{ github.run_id }}",
              "error": "ValueError: Invalid steps: Build cannot proceed!",
              "log_hint": "Check run_pipeline(0) in main_app.py",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "CURL FAILED"
